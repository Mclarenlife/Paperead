name: Build macOS test installer

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS build machine (use macos-15 if the latest image queue is busy)
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-15
          - macos-15-intel

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build universal DMG
        run: pnpm build:macos
      - name: Verify DMG, architectures and ad-hoc signature
        run: node scripts/verify-macos-installer.mjs
      - name: Upload test installer and checksum
        uses: actions/upload-artifact@v7
        with:
          name: Paperead-macOS-universal
          path: |
            release/Paperead_*_macOS-universal.dmg
            release/Paperead_*_macOS-universal.dmg.sha256
            release/macos-verification.json
          if-no-files-found: error
          retention-days: 14
